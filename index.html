<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Marketing Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--surface2:#F6F8FB;--ink:#18202F;--muted:#5A6478;--line:#D5DBE5;
  --plan:#0E7C86;--plan-soft:#D6EEF0;--act:#B86E00;--act-soft:#FCEBCB;--accent:#2E3A8C;--accent-soft:#E3E6F7;--danger:#B3261E;
  --head:"Bai Jamjuree","IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif;
  --body:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161E;--surface:#1B212C;--surface2:#222937;--ink:#E7EBF2;--muted:#9AA4B6;--line:#2E3645;
  --plan:#45BCC6;--plan-soft:#163A3E;--act:#F0A93B;--act-soft:#3B2D13;--accent:#9AA6FF;--accent-soft:#272E52;--danger:#FF8A80;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161E;--surface:#1B212C;--surface2:#222937;--ink:#E7EBF2;--muted:#9AA4B6;--line:#2E3645;
  --plan:#45BCC6;--plan-soft:#163A3E;--act:#F0A93B;--act-soft:#3B2D13;--accent:#9AA6FF;--accent-soft:#272E52;--danger:#FF8A80;color-scheme:dark;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--head);line-height:1.3;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 20px}
.brand{font-family:var(--head);font-weight:700;font-size:17px;margin-right:auto}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.camp-pick{display:flex;gap:8px;align-items:center}
.camp-pick select{min-width:200px;max-width:52vw}
.sync{font-size:12px;color:var(--muted)}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;max-width:1320px;margin:0 auto;padding:20px}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;text-decoration:none;color:var(--ink);padding:10px 8px;border-radius:10px;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;left:24px;top:46px;bottom:-6px;width:2px;background:var(--line)}
.step .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:700;border:2px solid var(--line);background:var(--surface);z-index:1}
.step.done .num{border-color:var(--plan);color:var(--plan)}
.step.active{background:var(--accent-soft)}
.step.active .num{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.step b{font-family:var(--head);font-weight:600;display:block}
.step span{font-size:12.5px;color:var(--muted);display:block}
.step em{font-style:normal;font-size:12px;color:var(--plan);font-weight:600}

.legend{margin-top:18px;padding:12px;border:1px dashed var(--line);border-radius:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}

main{min-width:0}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:16px}
.view-head h2{font-size:26px;font-weight:700;margin-right:auto}
.view-head p{margin:2px 0 0;color:var(--muted);font-size:14px;flex-basis:100%;order:2}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.panel h3{font-size:17px;font-weight:600;margin-bottom:12px}
.panel h3 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px}
.grid .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
label.f .hint{font-weight:400;font-size:12px}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.55}
input[type=number]{text-align:right}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--danger)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:13px;white-space:nowrap}
.link.plan{color:var(--plan)} .link.act{color:var(--act)}

.kpi-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi-in label{border-left:4px solid var(--plan);padding-left:10px}

.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:12.5px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.flash td{animation:flash 2.2s ease-out}
@keyframes flash{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){tr.flash td,.card.flash{animation:none;background:var(--accent-soft)}}
.t-title{font-weight:600}
.t-sub{font-size:12px;color:var(--muted)}
.pv{color:var(--plan)} .av{color:var(--act);font-weight:600}
td input[type=number]{width:96px;padding:5px 7px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.production::before{background:#7A6FD0}.chip.review::before{background:#D08A2E}.chip.scheduled::before{background:#3F8FD8}.chip.published::before{background:var(--plan)}

.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--muted)}
.stat b{font-family:var(--head);font-size:20px;color:var(--ink);margin-right:6px}

.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.col h3{font-size:14px;font-weight:600;margin:2px 4px 10px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.card.flash{animation:flash 2.2s ease-out}
.card .t-title{font-size:14px;line-height:1.4}
.card select{padding:4px 6px;font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .big{font-family:var(--head);font-weight:700;font-size:28px;color:var(--act);line-height:1.2;margin:4px 0}
.kpi .tgt{font-size:13px;color:var(--plan)}
.bar{height:10px;border-radius:5px;background:var(--plan-soft);margin-top:10px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--act);border-radius:5px}
.kpi .p{font-size:13px;font-weight:600;margin-top:6px}
.p.ok{color:var(--plan)} .p.low{color:var(--danger)}

.cal-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cal-nav h3{font-size:20px;font-weight:700;min-width:8.5em;text-align:center}
.cal-filter{flex-direction:row!important;align-items:center;gap:8px!important}
.cal-filter select{width:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.wd{background:var(--surface2);font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 8px}
.cell{background:var(--surface);min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell.out{background:var(--surface2)}
.cell.out .dn{opacity:.45}
.cell.rng{box-shadow:inset 0 3px 0 var(--plan)}
.cell.over,.tray.over{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.cell-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dn{font-family:var(--head);font-weight:600;font-size:14px;width:26px;height:26px;display:grid;place-items:center}
.today .dn{background:var(--accent);color:var(--surface);border-radius:50%}
.add{border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;width:26px;height:26px;border-radius:6px;font-size:17px;line-height:1;opacity:0}
.cell:hover .add,.add:focus-visible,.ag-day .add{opacity:1}
.add:hover{border-color:var(--line);color:var(--accent)}
@media (hover:none){.add{opacity:1}}
.pill{display:block;font-size:12px;line-height:1.35;padding:3px 6px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--muted);cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill:hover{border-color:var(--accent)}
.pill.production{border-left-color:#7A6FD0}.pill.review{border-left-color:#D08A2E}.pill.scheduled{border-left-color:#3F8FD8}.pill.published{border-left-color:var(--plan);background:var(--plan-soft)}
.pill.dragging{opacity:.4}
.pill.flash{animation:flash 2.2s ease-out}
.pch{font-weight:600;color:var(--muted);margin-right:5px}
.tray{min-height:52px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px dashed var(--line);border-radius:10px;align-items:center}
.tray .pill{max-width:280px}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.rng-key{display:inline-block;width:22px;height:3px;background:var(--plan);vertical-align:middle;margin-right:6px}
.agenda{display:none;margin-bottom:16px}
.ag-day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;flex-direction:column;gap:5px}
.ag-day.rng{border-top:3px solid var(--plan)}
.ag-day .pill{white-space:normal;font-size:13px;padding:6px 8px}
@media (max-width:700px){.cal{display:none}.agenda{display:block}}
.tc{display:flex;gap:10px;align-items:center}
.thumb,.cover{position:relative;flex:none;border:1px solid var(--line);padding:0;cursor:zoom-in;background:var(--surface2);overflow:hidden}
.thumb{width:48px;height:48px;border-radius:8px}
.cover{width:100%;aspect-ratio:16/10;border-radius:6px;display:block}
.thumb img,.cover img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span,.cover span{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;border-radius:4px;padding:0 5px}
.pthumb{width:16px;height:16px;border-radius:3px;object-fit:cover;vertical-align:-3px;margin-right:4px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:6px 0 8px}
.imgs figure{margin:0;position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}
.imgs button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.up-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.up-row label.btn{display:inline-block}
.gallery{display:grid;gap:10px}
.gallery img{width:100%;border-radius:10px;display:block;background:var(--surface2)}
.people{display:flex;align-items:center;gap:8px}
.avs{display:flex;padding-left:6px}
.av{width:28px;height:28px;border-radius:50%;border:2px solid var(--c,var(--line));background:var(--surface2);object-fit:cover;display:inline-grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-left:-6px;box-shadow:0 0 0 2px var(--surface);vertical-align:middle}
.av.sm{width:20px;height:20px;border-width:1.5px;font-size:10px;margin-left:-4px}
.feed li .av.sm{margin-left:0}
.navav{display:flex;margin-top:4px;padding-left:4px}
.editing{display:inline-block;font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:0 8px;margin-top:3px}
.pill.locked{outline:2px solid var(--accent);outline-offset:-1px}
.warn{background:var(--act-soft);border:1px solid var(--act);border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:12px}
.feed{margin-top:16px}
.feed h4{font-family:var(--head);font-size:14px;font-weight:600;margin:0 0 8px}
.feed ol{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:9px}
.feed li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:12.5px;line-height:1.45}
.feed li button{all:unset;cursor:pointer}
.feed li button:hover b{text-decoration:underline}
.feed li button:focus-visible{outline:2px solid var(--accent)}
.feed time{display:block;color:var(--muted);font-size:11.5px}
.ro-note{background:var(--accent-soft);border-radius:10px;padding:8px 14px;margin-bottom:14px;font-size:14px}
.ro main input,.ro main textarea,.ro main select:not(#calCh),.ro dialog input,.ro dialog textarea,.ro dialog select{pointer-events:none;opacity:.75}
.ro [data-act=new-campaign],.ro [data-act=new-content],.ro [data-act=sample],.ro [data-act=del-campaign],.ro .add,.ro [data-dact=save],.ro [data-dact=del],.ro .up-row,.ro .imgs button{display:none!important}
@media (max-width:900px){.steps .feed{display:none}.people .sync{display:none}}
.empty{text-align:center;padding:48px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty h2{font-size:22px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:46ch}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.next{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,14,22,.45)}
.dlg-in{padding:20px 22px;overflow:auto;max-height:90vh}
.dlg-in h2{font-size:20px;margin-bottom:14px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:12px;gap:12px}
  .steps{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .step{grid-template-columns:28px auto;padding:8px 10px;min-width:max-content;border:1px solid var(--line);background:var(--surface)}
  .step::after{display:none}
  .step .num{width:28px;height:28px;font-size:13px}
  .step span{display:none}
  .legend{display:none}
  .top{padding:10px 12px}
  .camp-pick{width:100%}
  .camp-pick select{flex:1;max-width:none;min-width:0}
  .view-head h2{font-size:22px}
}
@media print{.top,.steps,.btn,.link{display:none!important}.layout{display:block}.panel,.kpi{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Digital Marketing Workflow<small>วางแผน → คอนเทนต์ → แพลนเนอร์ → ดำเนินงาน → บันทึกผล → สรุปผล</small></div>
  <div class="camp-pick">
    <label for="campSel" class="sync">แคมเปญ</label>
    <select id="campSel" aria-label="เลือกแคมเปญ"></select>
    <button class="btn primary small" data-act="new-campaign">สร้างแคมเปญ</button>
  </div>
  <div class="people" id="people"></div><button class="btn small" id="feedBtn" data-act="feed" hidden>ความเคลื่อนไหว</button>
  <div class="sync" id="sync">กำลังเชื่อมต่อ…</div>
</header>
<div class="layout">
  <nav class="steps" id="nav" aria-label="ขั้นตอนการทำงาน"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const STAGES=[
  {id:'plan',t:'วางแผนแคมเปญ',d:'เป้าหมาย กลุ่มเป้าหมาย งบ และ KPI'},
  {id:'content',t:'แผนคอนเทนต์',d:'รายการชิ้นงานและเป้าหมาย'},
  {id:'planner',t:'แพลนเนอร์',d:'ปฏิทินเผยแพร่รายเดือน'},
  {id:'board',t:'ดำเนินงาน',d:'ติดตามสถานะการผลิต'},
  {id:'results',t:'บันทึกผล',d:'ตัวเลขจริงของแต่ละชิ้นงาน'},
  {id:'report',t:'สรุปผล',d:'แผนเทียบผลจริง และบทเรียน'}];
const KPIS=[['reach','การเข้าถึง (Reach)'],['engagement','การมีส่วนร่วม (Engagement)'],['clicks','คลิก (Clicks)'],['conversions','Conversion / ลีด']];
const STATUS=[['idea','ไอเดีย'],['production','กำลังผลิต'],['review','รอตรวจ/อนุมัติ'],['scheduled','ตั้งเวลาแล้ว'],['published','เผยแพร่แล้ว']];
const CHANNELS=['Facebook','Instagram','TikTok','YouTube','LINE OA','X','Website / Blog','Google Ads','Email'];
const FORMATS=['โพสต์ภาพ','Carousel','วิดีโอสั้น','วิดีโอยาว','Story','Live','บทความ','โฆษณา (Ads)','บรอดแคสต์'];
const RES=['reach','engagement','clicks','conversions','spend'];

const main=document.getElementById('main'),nav=document.getElementById('nav'),sel=document.getElementById('campSel'),dlg=document.getElementById('dlg');
let S={campaigns:{},contents:{}},cur=null,view='plan',focusId=null,mode='local',DB=null;
let calMonth=null,calCh='',ASSETS=null,ROOM=null,USER=null,ME=null,PEERS=[],PROF={},ACT=[],canWrite=true,EDITING=null;

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const isNum=v=>v!==null&&v!==undefined&&v!==''&&!isNaN(v);
const nf=n=>isNum(n)?Number(n).toLocaleString('th-TH',{maximumFractionDigits:0}):'–';
const nf2=n=>isNum(n)&&isFinite(n)?Number(n).toLocaleString('th-TH',{maximumFractionDigits:2}):'–';

    planner:{done:list.length>0&&list.every(x=>x.date),txt:list.length?`กำหนดวัน ${list.filter(x=>x.date).length}/${list.length}`:''},
    board:{done:list.length>0&&pub===list.length,txt:list.length?`เผยแพร่ ${pub}/${list.length}`:''},
    results:{done:pub>0&&a.rec>=pub,txt:list.length?`มีผล ${a.rec}/${list.length}`:''},
    report:{done:!!(c.insWorked||c.insImprove||c.nextSteps),txt:''}};
}
function renderNav(){
  const p=stageProgress();
  nav.innerHTML=STAGES.map((s,i)=>{const pr=p[s.id]||{};return `<a href="#${s.id}" class="step ${view===s.id?'active':''} ${pr.done?'done':''}" ${view===s.id?'aria-current="page"':''}>
    <div class="num">${pr.done&&view!==s.id?'✓':i+1}</div><div><b>${s.t}</b><span>${s.d}</span>${pr.txt?`<em>${pr.txt}</em>`:''}${navAv(s.id)}</div></a>`}).join('')+
  `<div class="legend"><div><i style="background:var(--plan)"></i>ตัวเลขตามแผน / เป้าหมาย</div><div><i style="background:var(--act)"></i>ตัวเลขผลจริง</div></div>`+feedHtml(8);
  const ids=Object.values(S.campaigns).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  sel.innerHTML=ids.length?ids.map(c=>`<option value="${c.id}" ${c.id===cur?'selected':''}>${esc(c.name||'แคมเปญไม่มีชื่อ')}</option>`).join(''):'<option value="">ยังไม่มีแคมเปญ</option>';
  sel.disabled=!ids.length;
  renderPeople();
}

function vReport(c){

    <div class="stat"><b class="av">${pf(ratio(a.conversions,a.clicks))}</b>Conversion rate (จากคลิก)</div>
    <div class="stat"><b class="av">${a.clicks?'฿'+nf2(a.spend/a.clicks):'–'}</b>ต้นทุนต่อคลิก (CPC)</div>
    <div class="stat"><b class="av">${a.conversions?'฿'+nf2(a.spend/a.conversions):'–'}</b>ต้นทุนต่อ Conversion (CPA)</div>
  </div></section>
  <section class="panel"><h3>ผลแยกตามช่องทาง</h3><div class="tablewrap"><table><thead><tr><th>ช่องทาง</th><th class="n">ชิ้นงาน</th><th class="n">Reach</th><th class="n">Engagement</th><th class="n">ER</th><th class="n">คลิก</th><th class="n">Conversion</th><th class="n">ใช้งบ</th></tr></thead><tbody>
   ${Object.keys(byCh).length?Object.entries(byCh).map(([ch,xs])=>{const g=agg(xs);return `<tr><td>${esc(ch)}</td><td class="n">${xs.length}</td><td class="n av">${nf(g.reach)}</td><td class="n av">${nf(g.engagement)}</td><td class="n">${pf(ratio(g.engagement,g.reach))}</td><td class="n av">${nf(g.clicks)}</td><td class="n av">${nf(g.conversions)}</td><td class="n av">${money(g.spend)}</td></tr>`}).join(''):'<tr><td colspan="8" class="t-sub">ยังไม่มีข้อมูล</td></tr>'}
  </tbody></table></div></section>
  <section class="panel"><h3>แผนเทียบผลจริง รายชิ้นงาน</h3><div class="tablewrap"><table><thead><tr><th>คอนเทนต์</th><th>สถานะ</th><th class="n">Reach แผน</th><th class="n">Reach จริง</th><th class="n">Eng. แผน</th><th class="n">Eng. จริง</th><th class="n">% เป้า Reach</th><th></th></tr></thead><tbody>
   ${list.length?list.map(x=>{const r=x.res||{};const p=isNum(x.tReach)&&Number(x.tReach)>0&&isNum(r.reach)?r.reach/x.tReach:null;return `<tr><td><button class="link plan" data-act="go" data-view="content" data-focus="${x.id}" style="text-align:left;white-space:normal">${esc(x.title||'ไม่มีชื่อ')}</button><div class="t-sub">${dfmt(x.date)} · ${esc(x.channel)}</div></td>

  ${top.length?`<section class="panel"><h3>ชิ้นงานที่ได้ผลดีที่สุด <small>เรียงตาม Engagement</small></h3><ol style="margin:0;padding-left:20px">${top.map(x=>`<li><button class="link" data-act="go" data-view="results" data-focus="${x.id}">${esc(x.title)}</button> <span class="t-sub">${esc(x.channel)} · ${esc(x.format)}</span> · <span class="av">${nf(x.res.engagement)}</span> engagement${x.res.note?` · <span class="t-sub">${esc(x.res.note)}</span>`:''}</li>`).join('')}</ol></section>`:''}

    <label class="f">สิ่งที่ต้องปรับ ${ta('campaigns',c.id,'insImprove',c.insImprove,'จุดที่ต่ำกว่าเป้า และสาเหตุที่คาดว่าเป็น',4)}</label>

function vPlanner(c){
  if(!calMonth){const b=c.start?new Date(c.start+'T00:00'):new Date();calMonth=new Date(b.getFullYear(),b.getMonth(),1)}
  const y=calMonth.getFullYear(),m=calMonth.getMonth(),mk=`${y}-${String(m+1).padStart(2,'0')}`;
  const all=contentsOf(c.id),list=all.filter(x=>!calCh||x.channel===calCh);
  const byDate={};list.forEach(x=>{if(x.date)(byDate[x.date]=byDate[x.date]||[]).push(x)});
  const unsched=list.filter(x=>!x.date);
  const first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));
  const days=[];for(let i=0;i<42;i++)days.push(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));
  while(days.length>28&&days[days.length-7].getMonth()!==m)days.splice(-7);
  const todayK=iso(new Date());
  const inRange=k=>!!(c.start&&c.end&&k>=c.start&&k<=c.end);
  const monthItems=list.filter(x=>x.date&&x.date.slice(0,7)===mk);
  const chCount={};monthItems.forEach(x=>{chCount[x.channel]=(chCount[x.channel]||0)+1});
  const pill=x=>`<div class="pill ${x.status} ${editorsOf(x.id).length?'locked':''}" role="button" tabindex="0" draggable="true" data-drag="${x.id}" data-row="${x.id}" data-act="edit-content" data-id="${x.id}" title="${esc((x.title||'')+' · '+x.channel+' · '+stLabel(x.status))}">${x.images&&x.images.length?`<img class="pthumb" src="${esc(imgSrc(x.images[0]))}" alt="">`:''}<span class="pch">${esc(chShort(x.channel))}</span>${esc(x.title||'ไม่มีชื่อ')}</div>`;
  const monthName=first.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
  const chs=[...new Set(all.map(x=>x.channel).filter(Boolean))];
  const WD=['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
  const addBtn=k=>`<button class="add" data-act="new-on-date" data-date="${k}" aria-label="เพิ่มคอนเทนต์วันที่ ${dfmt(k)}">+</button>`;
  const agendaDays=days.filter(d=>d.getMonth()===m&&(byDate[iso(d)]||[]).length);
  return head('3. แพลนเนอร์','ปฏิทินเผยแพร่รายเดือน กด + ในช่องวันที่เพื่อเพิ่มคอนเทนต์ ลากการ์ดเพื่อย้ายวัน หรือคลิกการ์ดเพื่อแก้ไข',`<button class="btn primary" data-act="new-content">เพิ่มคอนเทนต์</button>`)+
  `<div class="cal-bar"><div class="cal-nav"><button class="btn small" data-act="cal" data-d="-1" aria-label="เดือนก่อนหน้า">‹</button><h3>${monthName}</h3><button class="btn small" data-act="cal" data-d="1" aria-label="เดือนถัดไป">›</button><button class="btn small ghost" data-act="cal" data-d="0">เดือนนี้</button>${c.start?`<button class="btn small ghost" data-act="cal" data-d="s">เดือนเริ่มแคมเปญ</button>`:''}</div>
   <label class="f cal-filter">ช่องทาง<select id="calCh">${['',...chs].map(v=>`<option value="${esc(v)}" ${v===calCh?'selected':''}>${v?esc(v):'ทุกช่องทาง'}</option>`).join('')}</select></label></div>
  <div class="stats"><div class="stat"><b>${monthItems.length}</b>ชิ้นในเดือนนี้</div>${Object.entries(chCount).map(([k,n])=>`<div class="stat"><b>${n}</b>${esc(k)}</div>`).join('')}${unsched.length?`<div class="stat"><b>${unsched.length}</b>ยังไม่กำหนดวัน</div>`:''}</div>
  <div class="cal" aria-label="ปฏิทิน ${monthName}">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}
   ${days.map(d=>{const k=iso(d),its=byDate[k]||[];return `<div class="cell ${d.getMonth()!==m?'out':''} ${inRange(k)?'rng':''} ${k===todayK?'today':''}" data-drop="${k}"><div class="cell-h"><span class="dn">${d.getDate()}</span>${addBtn(k)}</div>${its.map(pill).join('')}</div>`}).join('')}</div>
  <div class="agenda">${agendaDays.length?agendaDays.map(d=>{const k=iso(d);return `<div class="ag-day ${inRange(k)?'rng':''} ${k===todayK?'today':''}"><div class="cell-h"><b>${d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})}</b>${addBtn(k)}</div>${byDate[k].map(pill).join('')}</div>`}).join(''):'<p class="t-sub">ยังไม่มีคอนเทนต์ในเดือนนี้ กดเพิ่มคอนเทนต์เพื่อเริ่มวางแผน</p>'}</div>
  <section class="panel"><h3>ยังไม่กำหนดวัน <small>ลากการ์ดไปวางบนปฏิทินเพื่อกำหนดวัน หรือคลิกเพื่อใส่วันที่</small></h3><div class="tray" data-drop="">${unsched.length?unsched.map(pill).join(''):'<span class="t-sub">ทุกชิ้นกำหนดวันแล้ว</span>'}</div></section>
  <div class="cal-legend">${STATUS.map(([s,l])=>`<span class="chip ${s}">${l}</span>`).join('')}<span class="t-sub"><span class="rng-key"></span>อยู่ในช่วงแคมเปญ</span></div>
  <div class="next">${goBtn('content','','ย้อนกลับ: แผนคอนเทนต์')}${goBtn('board','','ขั้นถัดไป: ดำเนินงาน')}</div>`;
}

function render(){
  const ae=document.activeElement;let keep=null;
  if(ae&&ae.dataset&&ae.dataset.k&&main.contains(ae))keep={k:ae.dataset.k,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd};
  const sy=window.scrollY;
  ensureCur();renderNav();
  const c=camp();
  main.innerHTML=(canWrite?'':'<div class="ro-note">คุณมีสิทธิ์ดูอย่างเดียว ขอสิทธิ์แก้ไขจากเจ้าของหน้านี้เพื่อร่วมทำงาน</div>')+(!c?emptyAll():({plan:vPlan,content:vContent,planner:vPlanner,board:vBoard,results:vResults,report:vReport}[view]||vPlan)(c));
  if(keep){const el=main.querySelector(`[data-k="${CSS.escape(keep.k)}"]`);if(el){el.value=keep.v;el.focus({preventScroll:true});try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
  if(focusId){const row=main.querySelector(`[data-row="${CSS.escape(focusId)}"]`);focusId=null;

  else if(act==='feed')openFeed();
  else if(act==='export-xlsx')exportReport(a);
  else if(act==='edit-content')openContent(a.dataset.id);
  else if(act==='del-campaign'){const c=camp();if(!c)return;askConfirm(`ลบแคมเปญ “${c.name||'ไม่มีชื่อ'}” และคอนเทนต์ทั้งหมดในแคมเปญนี้?`,()=>{logAct(`ลบแคมเปญ “${c.name||''}”`,null,true);contentsOf(c.id).forEach(x=>{dropImgs(x);remove('contents',x.id)});remove('campaigns',c.id);cur=null;render()})}
});
main.addEventListener('change',e=>{
  const el=e.target;if(el.id==='calCh'){calCh=el.value;render();return}if(!el.dataset||!el.dataset.f)return;
  const kind=el.dataset.kind,id=el.dataset.id,src=S[kind][id];if(!src)return;
  const obj=JSON.parse(JSON.stringify(src));let v=el.value;
  if(el.hasAttribute('data-num'))v=v===''?null:Math.max(0,Number(v));
  if(getPath(obj,el.dataset.f)===v)return;
  patch(kind,id,el.dataset.f,v);logChange(kind,id,el.dataset.f,v);
  if(el.tagName==='SELECT'||el.hasAttribute('data-num'))render();else renderNav();
});
sel.addEventListener('change',()=>{setCur(sel.value);render()});
dlg.addEventListener('close',()=>{EDITING=null;dlg.dataset.openId='';pushPresence()});
main.addEventListener('keydown',e=>{const p=e.target.closest('[role=button][data-act]');if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();p.click()}});
main.addEventListener('dragstart',e=>{const p=e.target.closest&&e.target.closest('[data-drag]');if(!p)return;if(!canWrite){e.preventDefault();return}e.dataTransfer.setData('text/plain',p.dataset.drag);e.dataTransfer.effectAllowed='move';p.classList.add('dragging')});
main.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return;e.preventDefault();e.dataTransfer.dropEffect='move';main.querySelectorAll('.over').forEach(o=>{if(o!==c)o.classList.remove('over')});c.classList.add('over')});
main.addEventListener('dragend',()=>main.querySelectorAll('.over,.dragging').forEach(o=>o.classList.remove('over','dragging')));
main.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain'),x=S.contents[id];if(!x){render();return}const nd=c.dataset.drop;if((x.date||'')===nd){render();return}if(!canWrite){render();return}patchObj('contents',id,{date:nd});logAct(`ย้าย “${x.title||''}” ไป${nd?'วันที่ '+dfmt(nd):'รายการยังไม่กำหนดวัน'}`,id,true);render();toast(nd?'ย้ายไปวันที่ '+dfmt(nd)+' แล้ว':'ย้ายไปรายการที่ยังไม่กำหนดวันแล้ว')});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(STAGES.some(s=>s.id===h)&&h!==view){view=h;window.scrollTo(0,0);render()}});

/* ---------- boot ---------- */
const h0=location.hash.slice(1);if(STAGES.some(s=>s.id===h0))view=h0;
const local=lsGet('dmw-data');if(local&&local.campaigns)S={campaigns:local.campaigns||{},contents:local.contents||{}};
document.getElementById('sync').textContent='บันทึกไว้ในเบราว์เซอร์นี้';
render();
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{});
    const db=await window.claude.use('db');if(!db)return;
    DB=db;mode='db';S={campaigns:{},contents:{}};
    document.getElementById('sync').textContent='ซิงก์ข้อมูลร่วมกับทีมแบบเรียลไทม์';
    const sub=kind=>db.collection(kind).onSnapshot(q=>{const m={};q.docs.forEach(d=>{const x=d.data();if(x)m[d.id]=Object.assign({id:d.id},x)});S[kind]=m;render();resolveProfiles()},
      err=>{toast('การซิงก์หยุดทำงาน รีเฟรชหน้าเพื่อเชื่อมต่อใหม่');document.getElementById('sync').textContent='การซิงก์หยุดทำงาน'});
    sub('campaigns');sub('contents');
    try{ASSETS=await window.claude.use('assets')}catch(e){ASSETS=null}
    document.getElementById('feedBtn').hidden=false;
    db.collection('activity').orderBy('at','desc').limit(40).onSnapshot(q=>{ACT=q.docs.map(d=>d.data()).filter(Boolean);renderNav();resolveProfiles()},()=>{});
    try{USER=await window.claude.use('user');if(USER){ME=await USER.id();const w=await USER.can('data.write');if(w===false){canWrite=false;document.body.classList.add('ro')}}}catch(e){}
    try{ROOM=await window.claude.use('room');if(ROOM){ROOM.onPeers(ch=>{PEERS=(ch.peers||[]).filter(p=>p.kind==='viewer');render();resolveProfiles()},()=>{});pushPresence()}}catch(e){}
    render();resolveProfiles();
  }catch(e){}
})();
})();
</script>
</body>
</html>
